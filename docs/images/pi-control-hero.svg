<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">pi-control operator loop</title><desc id="desc">A compact operator control loop: capture runtime state, make a bounded change, verify behavior, and keep evidence.</desc>
<rect width="1200" height="520" rx="36" fill="#111418"/>
<g fill="none" stroke="#343a40" stroke-width="2"><path d="M120 312H1080"/><path d="M300 312V228M520 312V228M740 312V228M960 312V228"/></g>
<text x="92" y="112" fill="#f2f4f5" font-family="ui-sans-serif,system-ui,sans-serif" font-size="54" font-weight="700">pi-control</text>
<text x="94" y="164" fill="#9aa3aa" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24">Control the live Pi runtime. Change less. Verify more.</text>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" font-weight="600">
<g><rect x="190" y="222" width="220" height="94" rx="18" fill="#1b2025" stroke="#48515a"/><text x="220" y="262" fill="#dfe4e7">01  capture</text><text x="220" y="290" fill="#86919a" font-size="15">sessions · tools · state</text></g>
<g><rect x="410" y="222" width="220" height="94" rx="18" fill="#1b2025" stroke="#48515a"/><text x="440" y="262" fill="#dfe4e7">02  change</text><text x="440" y="290" fill="#86919a" font-size="15">models · tools · guards</text></g>
<g><rect x="630" y="222" width="220" height="94" rx="18" fill="#1b2025" stroke="#48515a"/><text x="660" y="262" fill="#dfe4e7">03  verify</text><text x="660" y="290" fill="#86919a" font-size="15">claims · QA · behavior</text></g>
<g><rect x="850" y="222" width="220" height="94" rx="18" fill="#20261f" stroke="#5f725c"/><text x="880" y="262" fill="#e5ebe3">04  evidence</text><text x="880" y="290" fill="#9baa98" font-size="15">report what actually ran</text></g>
</g>
<text x="94" y="420" fill="#6f7a82" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17">Pi-native · local runtime · no second session store · no remote control plane</text>
