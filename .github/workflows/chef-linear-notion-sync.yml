# On PR events this file used to call OrgBeheer chef-dev-sync-reusable.
# Disabled here: this public package does not receive org LINEAR_API_KEY
# (visibility: private), and reusable-job `if: secrets.*` is invalid
# ("Unrecognized named-value: secrets"). Keep a skipped job so the copied
# workflow name does not fail the PR.
name: CHEF Linear + Notion Sync

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

concurrency:
  group: chef-linear-notion-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  sync:
    if: false
    runs-on: ${{ fromJSON('["self-hosted","Linux","X64","pr-isolated"]') }}
    steps:
      - run: echo "Linear sync disabled on this public package repo"
